[package]
name = "java-mapping-serde-util"
version = "0.1.0"
description = "Utilities for transforming mappings and writing mapping-serde deserializers"
categories = ["parsing"]
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mapping-serde = { path = "../", version = "0.1.0", package = "java-mapping-serde", default-features = false }
io-util = { path = "../io", version = "0.1.0", package = "java-mapping-serde-io-util", optional = true }
smol_str = { version = "0.3", optional = true }
smallvec = { version = "1.15", optional = true }

[dev-dependencies]
mapping-serde-enigma = { path = "../formats/enigma", package = "java-mapping-serde-enigma" }
mapping-serde-tiny2 = { path = "../formats/tiny2", package = "java-mapping-serde-tiny2" }

[features]
default = ["std"]
std = ["mapping-serde/std"]
translate = ["dep:smol_str", "dep:io-util", "dep:smallvec", "std"]

[lints]
workspace = true
